<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multidimensional Operational Excellence Audit</title>
  <style>
    :root {
      --primary: #005a70;
      --primary-hover: #004354;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --border-color: #dbe2e6;
      --text-color: #2c3e50;
      --accent-color: #27ae60;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }

    .container {
      max-width: 1150px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      padding: 30px;
    }

    header {
      border-bottom: 2px solid var(--primary);
      padding-bottom: 15px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    h1 {
      color: var(--primary);
      font-size: 26px;
    }

    .metrics-summary-bar {
      display: flex;
      gap: 15px;
      background: #eef6f8;
      border: 1px solid #bce0e8;
      border-radius: 6px;
      padding: 12px 20px;
      margin-bottom: 25px;
      justify-content: space-around;
      flex-wrap: wrap;
    }

    .metric-item {
      text-align: center;
    }

    .metric-item .value {
      font-size: 22px;
      font-weight: bold;
      color: var(--primary);
    }

    .metric-item .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #555;
    }

    .header-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
      background: #fafafa;
      padding: 20px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-weight: 600;
      font-size: 14px;
      color: var(--primary);
    }

    .form-group input {
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 14px;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .area-block {
      margin-bottom: 30px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }

    .area-header {
      background: var(--primary);
      color: white;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 18px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background: #f1f5f7;
      font-size: 13px;
      text-transform: uppercase;
      color: #555;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover {
      background-color: #fcfcfc;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
    }

    .radio-label input {
      cursor: pointer;
      width: 16px;
      height: 16px;
    }

    /* Editable reference-link column (right side of every question) */
    .ref-cell {
      vertical-align: middle;
      background: #fcfdfd;
      padding: 8px 10px;
    }

    .ref-input {
      width: 100%;
      min-height: 34px;
      padding: 5px 4px;
      font-size: 11.5px;
      line-height: 1.45;
      font-family: inherit;
      color: #14515f;
      border: none;
      border-bottom: 1px dotted #b9c6cc;
      border-radius: 0;
      background: transparent;
      resize: none;
      overflow: auto;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .ref-input:focus {
      outline: none;
      border-bottom: 1px solid var(--primary);
      background: #ffffff;
    }

    .ref-input::placeholder {
      color: #a9b8be;
      font-style: italic;
    }

    .ref-input:not(:placeholder-shown) {
      border-bottom-color: #7fb3c0;
    }

    .actions {
      display: flex;
      gap: 15px;
      justify-content: flex-end;
      margin-top: 30px;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-reset {
      background-color: #e74c3c;
      color: white;
    }

    .btn-reset:hover {
      background-color: #c0392b;
    }

    .btn-print {
      background-color: var(--primary);
      color: white;
    }

    .btn-print:hover {
      background-color: var(--primary-hover);
    }

    .score-summary {
      background-color: #e8f4f8;
      border: 1px solid #bce0e8;
      padding: 20px;
      border-radius: 6px;
      margin-top: 30px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .score-box {
      text-align: center;
    }

    .score-box .num {
      font-size: 28px;
      font-weight: bold;
      color: var(--primary);
    }

    .score-box .lbl {
      font-size: 13px;
      color: #555;
    }

    /* Audit remarks / comments section */
    .remarks-block {
      margin-top: 30px;
    }

    .remarks-body {
      padding: 18px;
      background: #fcfdfd;
    }

    .remarks-input {
      width: 100%;
      min-height: 150px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.65;
      font-family: inherit;
      color: var(--text-color);
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      resize: vertical;
    }

    .remarks-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 90, 112, 0.08);
    }

    .remarks-input::placeholder {
      color: #9aa9b0;
      font-style: italic;
    }

    /* Lined writing area for the printed sheet */
    @media print {
      .remarks-input {
        border: 1px solid #c7d2d8 !important;
        min-height: 160px !important;
      }
      .remarks-input::placeholder {
        color: transparent;
      }
      .remarks-block {
        page-break-inside: avoid;
      }
    }

    @media print {
      body {
        background: none;
        padding: 0;
      }
      .container {
        box-shadow: none;
        padding: 0;
        max-width: 100%;
      }
      .actions {
        display: none;
      }
      .ref-cell {
        background: none;
      }
      .ref-input {
        color: #000 !important;
        font-size: 10px;
      }
      .ref-input::placeholder {
        color: transparent;
      }
      tr {
        page-break-inside: avoid;
      }
      input {
        border: none !important;
        background: transparent !important;
      }
    }

    /* ==========================================================
       RESPONSIVE / MOBILE
       Screen only, so the printed sheet keeps the full table.
       ========================================================== */
    @media screen and (max-width: 1000px) {
      .container {
        max-width: 100%;
      }
      th, td {
        padding: 10px 12px;
      }
    }

    @media screen and (max-width: 780px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 16px 14px;
        border-radius: 6px;
      }

      h1 {
        font-size: 19px;
        line-height: 1.3;
      }

      header {
        padding-bottom: 12px;
        margin-bottom: 16px;
      }

      /* Metrics: three even columns instead of wrapping */
      .metrics-summary-bar {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        padding: 10px 8px;
        margin-bottom: 16px;
      }

      .metric-item .value {
        font-size: 18px;
      }

      .metric-item .label {
        font-size: 9.5px;
        letter-spacing: 0.3px;
      }

      .header-info {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 14px;
        margin-bottom: 20px;
      }

      /* 16px keeps iOS Safari from zooming when a field is focused */
      .form-group input,
      .remarks-input {
        font-size: 16px;
      }

      /* Tables collapse into stacked question cards */
      .area-block {
        margin-bottom: 18px;
      }

      .area-header {
        font-size: 14.5px;
        padding: 10px 14px;
        line-height: 1.35;
      }

      table,
      tbody {
        display: block;
        width: 100%;
      }

      thead {
        display: none;
      }

      tbody tr {
        display: block;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border-color);
      }

      tbody tr:last-child {
        border-bottom: none;
      }

      tbody tr:hover {
        background-color: transparent;
      }

      tbody td {
        display: block;
        width: auto !important;
        padding: 0;
        border-bottom: none;
        text-align: left !important;
      }

      tbody td:first-child {
        font-size: 15px;
        line-height: 1.45;
        margin-bottom: 8px;
      }

      /* Re-state the column meaning, since the table head is hidden */
      tbody td:nth-child(2)::before,
      tbody td.ref-cell::before {
        content: "Response (0 / 1)";
        display: block;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #7c8b92;
        margin-bottom: 4px;
      }

      tbody td.ref-cell::before {
        content: "Reference link";
      }

      .radio-group {
        justify-content: flex-start !important;
        gap: 24px;
        padding: 0 0 12px;
      }

      .radio-label {
        font-size: 15px;
      }

      .radio-label input {
        width: 20px;
        height: 20px;
      }

      .ref-cell {
        padding: 0;
        background: transparent;
      }

      .ref-input {
        min-height: 44px;
        padding: 9px 10px;
        font-size: 16px;
        border: 1px dashed #c3d2d8;
        border-radius: 4px;
        background: #ffffff;
      }

      .ref-input:focus {
        border-style: solid;
        border-color: var(--primary);
      }

      .remarks-body {
        padding: 14px;
      }

      .remarks-input {
        min-height: 130px;
        padding: 12px;
      }

      .score-summary {
        flex-direction: column;
        gap: 10px;
        padding: 16px;
        margin-top: 20px;
      }

      .score-box .num {
        font-size: 24px;
      }

      /* Full-width, thumb-friendly buttons (primary action on top) */
      .actions {
        flex-direction: column-reverse;
        gap: 10px;
        margin-top: 20px;
      }

      .actions button {
        width: 100%;
        padding: 14px 20px;
        font-size: 16px;
      }
    }

    @media screen and (max-width: 380px) {
      h1 {
        font-size: 17px;
      }
      .metrics-summary-bar {
        padding: 8px 4px;
      }
      .metric-item .value {
        font-size: 16px;
      }
      .metric-item .label {
        font-size: 8.5px;
      }
      tbody tr {
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Multidimensional Operational Excellence Audit</h1>
  </header>

  <!-- Top Metrics Summary -->
  <div class="metrics-summary-bar">
    <div class="metric-item">
      <div class="value" id="topTotalQuestions">42</div>
      <div class="label">Total Questions</div>
    </div>
    <div class="metric-item">
      <div class="value" id="topTotalAnswered">0</div>
      <div class="label">Questions Answered</div>
    </div>
    <div class="metric-item">
      <div class="value" id="topTotalScore">0</div>
      <div class="label">Total Score</div>
    </div>
  </div>

  <form id="auditForm">
    <!-- Header Information -->
    <div class="header-info">
      <div class="form-group">
        <label for="sbu">Strategic Business Unit (SBU)</label>
        <input type="text" id="sbu" placeholder="" required>
      </div>
      <div class="form-group">
        <label for="auditor">Auditor Name</label>
        <input type="text" id="auditor" required>
      </div>
      <div class="form-group">
        <label for="date">Audit Date</label>
        <input type="date" id="date" required>
      </div>
    </div>

    <!-- Questions Container -->
    <div id="questionsContainer"></div>

    <!-- Audit Remarks & Comments -->
    <div class="area-block remarks-block">
      <div class="area-header">Audit Remarks &amp; Comments</div>
      <div class="remarks-body">
        <div class="form-group">
          <label for="remarks">Auditor Comments / Observations</label>
          <textarea id="remarks" class="remarks-input" rows="7"
                    placeholder="Write audit comments &mdash; key observations, good practices, gaps identified, root causes, agreed corrective actions, responsible persons and target dates&hellip;"></textarea>
        </div>
      </div>
    </div>

    <!-- Bottom Score Summary -->
    <div class="score-summary">
      <div class="score-box">
        <div class="num" id="totalScore">0 / 42</div>
        <div class="lbl">Total Score</div>
      </div>
      <div class="score-box">
        <div class="num" id="answeredCount">0 / 42</div>
        <div class="lbl">Questions Answered</div>
      </div>
    </div>

    <!-- Form Action Buttons -->
    <div class="actions">
      <button type="button" class="btn-reset" onclick="resetAuditForm()">Reset Form</button>
      <button type="button" class="btn-print" onclick="window.print()">Print / Export PDF</button>
    </div>
  </form>
</div>

<script>
  const auditData = [
    {
      area: "Daily Operations Management",
      questions: [
        "Are daily operations meetings conducted as scheduled?",
        "Are meeting minutes, attendance records, and action points documented?",
        "Are previous meeting action points reviewed and followed up?",
        "Are OEE, production, quality, safety, downtime, and performance gaps reviewed?",
        "Are action owners and target completion dates assigned?"
      ]
    },
    {
      area: "Problem Solving & Kaizen",
      questions: [
        "Are Kaizen proposals evaluated regularly and validated by the Kaizen Committee?",
        "Are implemented Kaizens documented with before-and-after evidence?",
        "Are Kaizen cost savings verified by Finance?",
        "Are problem cards reviewed regularly?",
        "Are identified problems assigned to responsible owners?",
        "Is RCA conducted for recurring or significant problems?",
        "Is corrective-action effectiveness verified?",
        "Are Kaizen participation and implementation performance monitored?",
        "Is SPC report maintained regularly?",
        "Is QCP audit done regularly?"
      ]
    },
    {
      area: "5S Workplace Management",
      questions: [
        "Are 5S audits conducted according to schedule?",
        "Are 5S verification audits conducted?",
        "Are 5S standards and visual controls maintained on the shop floor?"
      ]
    },
    {
      area: "Four-Hourly Performance Review",
      questions: [
        "Are four-hourly performance meetings conducted as scheduled?",
        "Are production targets versus actual performance reviewed every four hours?",
        "Are performance losses and deviations identified and escalated?",
        "Are corrective actions from four-hourly reviews tracked until closure?"
      ]
    },
    {
      area: "Improvement Project Management",
      questions: [
        "Are expected project outcomes and measurable benefits defined before initiation?",
        "Is project feasibility evaluated before approval?",
        "Are project owners and supporting responsibilities defined?",
        "Are project start dates, deadlines, and milestones established?",
        "Is project progress reviewed regularly?",
        "Are actual project benefits verified against targets after implementation?",
        "Are completed projects documented and standardized where applicable?"
      ]
    },
    {
      area: "Cost Control & Resource Optimization",
      questions: [
        "Are manpower requirements reviewed against approved standards?",
        "Is overtime monitored and analyzed regularly?",
        "Are material waste, scrap, and rework losses monitored?",
        "Are cost reduction initiatives tracked and actual savings validated?"
      ]
    },
    {
      area: "Standardization & Employee Engagement",
      questions: [
        "Are current SOPs and work instructions available at workstations?",
        "Are employees trained on applicable SOPs?"
      ]
    },
    {
      area: "Digitalization & IT Systems",
      questions: [
        "Are warehouse locations properly configured in the Inventory module?",
        "Is Item Plant Warehouse configured for all required items?",
        "Are existing Shop Floor configurations checked before creating new ones?",
        "Are Production Lines configured without duplication?",
        "Are existing Work Centers verified before creating new ones?",
        "Is Routing configured after completing Shop Floor, Production Line and Work Center setup?",
        "Are required items mapped against respective machines in OEE Capacity Configuration?"
      ]
    }
  ];

  let totalQuestionsCount = 0;

  function renderForm() {
    const container = document.getElementById('questionsContainer');
    let qIndex = 0;

    auditData.forEach((group) => {
      const areaBlock = document.createElement('div');
      areaBlock.className = 'area-block';

      const header = document.createElement('div');
      header.className = 'area-header';
      header.innerText = group.area;
      areaBlock.appendChild(header);

      const table = document.createElement('table');
      table.innerHTML = `
        <thead>
          <tr>
            <th style="width: 55%;">Audit Question</th>
            <th style="width: 20%; text-align: center;">Response (0 / 1)</th>
            <th style="width: 25%;">Reference Link</th>
          </tr>
        </thead>
        <tbody></tbody>
      `;

      const tbody = table.querySelector('tbody');

      group.questions.forEach((q) => {
        qIndex++;
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${q}</td>
          <td style="text-align: center;">
            <div class="radio-group" style="justify-content: center;">
              <label class="radio-label">
                <input type="radio" name="q_${qIndex}" value="1" onchange="calculateScore()"> Yes (1)
              </label>
              <label class="radio-label">
                <input type="radio" name="q_${qIndex}" value="0" onchange="calculateScore()"> No (0)
              </label>
            </div>
          </td>
          <td class="ref-cell">
            <textarea class="ref-input" name="ref_${qIndex}" rows="1"
                      placeholder="Paste reference link&hellip;" autocomplete="off" spellcheck="false"></textarea>
          </td>
        `;
        tbody.appendChild(row);
      });

      areaBlock.appendChild(table);
      container.appendChild(areaBlock);
    });

    totalQuestionsCount = qIndex;
    document.getElementById('topTotalQuestions').innerText = totalQuestionsCount;
    document.getElementById('date').valueAsDate = new Date();

    // Auto-grow the reference-link boxes as text is typed or pasted
    container.addEventListener('input', (e) => {
      if (e.target.classList.contains('ref-input')) autoGrow(e.target);
    });

    // Show correct totals immediately on load (no click needed)
    calculateScore();
  }

  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = Math.max(34, el.scrollHeight) + 'px';
  }

  function calculateScore() {
    let score = 0;
    let answered = 0;

    for (let i = 1; i <= totalQuestionsCount; i++) {
      const selected = document.querySelector(`input[name="q_${i}"]:checked`);
      if (selected) {
        answered++;
        score += parseInt(selected.value, 10);
      }
    }

    // Update Top Summary
    document.getElementById('topTotalAnswered').innerText = answered;
    document.getElementById('topTotalScore').innerText = score;

    // Update Bottom Summary
    document.getElementById('totalScore').innerText = `${score} / ${totalQuestionsCount}`;
    document.getElementById('answeredCount').innerText = `${answered} / ${totalQuestionsCount}`;
  }

  function resetAuditForm() {
    document.getElementById('auditForm').reset();
    document.getElementById('date').valueAsDate = new Date();
    calculateScore();
  }

  window.onload = renderForm;
</script>

</body>
</html>
